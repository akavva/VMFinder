name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build vmfinder.exe
        shell: cmd
        env:
          VMFINDER_VERSION: ${{ github.ref_name }}
        run: build.bat

      - name: Verify the exe was produced and reports the right version
        shell: pwsh
        run: |
          if (!(Test-Path "dist\vmfinder.exe")) {
            throw "Build did not produce dist\vmfinder.exe"
          }

          $reported = & "dist\vmfinder.exe" --version
          Write-Host "vmfinder.exe --version -> $reported"
          if ($reported -notlike "*${{ github.ref_name }}*") {
            throw "Expected version ${{ github.ref_name }} but got: $reported"
          }

          $fileVersion = (Get-Item "dist\vmfinder.exe").VersionInfo.FileVersion
          Write-Host "Embedded file version -> $fileVersion"
          if ($fileVersion -notlike "*${{ github.ref_name }}*") {
            throw "Expected embedded file version ${{ github.ref_name }} but got: $fileVersion"
          }

      - name: Smoke test vmfinder.exe
        shell: pwsh
        run: |
          $env:VMFINDER_HOME = Join-Path $env:RUNNER_TEMP "vmfinder-home"
          New-Item -ItemType Directory -Force -Path $env:VMFINDER_HOME | Out-Null

          $env:VMFINDER_ADMIN_HASH = (python -c "import hashlib; print(hashlib.sha256(b'ci-test-password').hexdigest())")
          $env:VC1_NAME = "CI-TestVC"
          $env:VC1_IP   = "127.0.0.1"
          $env:VC1_USER = "ci-user"
          $env:VC1_PASS = "ci-pass"
          $env:VC1_PORT = "443"

          $proc = Start-Process -FilePath "dist\vmfinder.exe" -PassThru -RedirectStandardOutput "vmfinder-stdout.log" -RedirectStandardError "vmfinder-stderr.log"

          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:5000/" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          Write-Host "----- stdout -----"
          Get-Content "vmfinder-stdout.log" -ErrorAction SilentlyContinue
          Write-Host "----- stderr -----"
          Get-Content "vmfinder-stderr.log" -ErrorAction SilentlyContinue

          if (-not $ok) {
            throw "vmfinder.exe did not respond with HTTP 200 on port 5000 within 20 seconds"
          }

      - name: Upload vmfinder.exe
        uses: actions/upload-artifact@v4
        with:
          name: vmfinder-windows
          path: dist/vmfinder.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    # glibc 2.28 (AlmaLinux 8) so the binary also starts on RHEL/Rocky 8,
    # Ubuntu 20.04 and Debian 10 — see .github/workflows/linux-build.yml.
    # The /opt/python/cpXXX-cpXXX interpreters this image ships for building
    # portable wheels are compiled without --enable-shared (manylinux policy),
    # so PyInstaller can't link against libpython from them. The image's
    # system /usr/bin/python3.12 is a normal dynamically-linked build, so use
    # that instead.
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      PYTHON: /usr/bin/python3.12
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/vmfinder
        env:
          VMFINDER_VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: Verify the binary was produced and reports the right version
        run: |
          if [ ! -x dist/vmfinder ]; then
            echo "Build did not produce an executable dist/vmfinder"
            exit 1
          fi
          ls -lh dist/vmfinder

          reported="$(./dist/vmfinder --version)"
          echo "vmfinder --version -> $reported"
          case "$reported" in
            *"${{ github.ref_name }}"*) ;;
            *) echo "Expected version ${{ github.ref_name }} but got: $reported"; exit 1 ;;
          esac

      - name: Smoke test dist/vmfinder
        run: ci/smoke-test.sh

      - name: Upload vmfinder binary
        uses: actions/upload-artifact@v4
        with:
          name: vmfinder-linux
          path: dist/vmfinder
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vmfinder-windows
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: vmfinder-linux
          path: assets

      - name: Name the release assets
        run: |
          # The Windows asset carries the tag, matching earlier releases. The
          # Linux asset deliberately does not, so that
          # /releases/latest/download/vmfinder-linux-x86_64 is a stable URL the
          # README can hand users as a one-line curl. The tag is still
          # recoverable from the binary itself via --version.
          mv assets/vmfinder.exe "assets/vmfinder-${GITHUB_REF_NAME}.exe"
          mv assets/vmfinder assets/vmfinder-linux-x86_64
          ls -lh assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "assets/vmfinder-${GITHUB_REF_NAME}.exe" \
            "assets/vmfinder-linux-x86_64" \
            --title "VMFinder ${GITHUB_REF_NAME}" \
            --generate-notes
