name: Linux build & smoke test

on:
  push:
    branches: [Linux-installer]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Build against glibc 2.28 (AlmaLinux 8) so the binary also starts on
    # RHEL/Rocky 8, Ubuntu 20.04 and Debian 10. A PyInstaller binary will not
    # run on a glibc older than the one it was built against, and the default
    # ubuntu-latest runner would silently limit us to Ubuntu 24.04+.
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      PYTHON: /opt/python/cp312-cp312/bin/python3
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/vmfinder
        run: ./build.sh

      - name: Verify the binary was produced
        run: |
          if [ ! -x dist/vmfinder ]; then
            echo "Build did not produce an executable dist/vmfinder"
            exit 1
          fi
          ls -lh dist/vmfinder

      - name: Start vmfinder with a test configuration and check it serves
        run: ci/smoke-test.sh

      - name: Upload built binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmfinder-linux-x86_64
          path: dist/vmfinder
          if-no-files-found: warn
