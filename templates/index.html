<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMFinder — Operational Control Panel</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0b0f12;
            --bg-card: #141b22;
            --bg-input: #1a232d;
            --accent-green: #7cb342;
            --accent-green-hover: #689f38;
            --btn-copy-success: #2e7d32;
            --btn-power: #4caf50;
            --btn-reboot: #ffb300;
            --btn-shutdown: #f44336;
            --btn-disconnect: #e53935;
            --text-main: #f5f7fa;
            --text-muted: #8a99a8;
            --border-color: #243140;
            --font-stack: 'Inter', system-ui, sans-serif;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1e2d24 0%, var(--bg-main) 70%);
        }

        #title-container {
            display: flex;
            justify-content: center;
            padding: 40px 20px 20px;
        }

        #vmfinder-header {
            font-size: 38px;
            font-weight: 700;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s ease;
        }

        #vmfinder-header:hover { transform: scale(1.01); }
        #vmfinder-header i { color: var(--accent-green); text-shadow: 0 0 20px rgba(124,179,66,0.4); }

        #searchForm {
            max-width: 600px;
            margin: 0 auto 35px;
            padding: 0 20px;
        }

        .search-input-wrapper {
            display: flex;
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 6px 6px 16px;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .search-input-wrapper:focus-within { border-color: var(--accent-green); }

        #searchInput {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-main);
            font-size: 16px;
        }

        button[type="submit"] {
            padding: 10px 24px;
            background-color: var(--accent-green);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button[type="submit"]:hover { background-color: var(--accent-green-hover); }

        #progress-container {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            background: rgba(20,27,34,0.6);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        #searchForm.searching #progress-container { display: flex; }

        #searchProgress {
            width: 150px;
            height: 6px;
            appearance: none;
        }
        #searchProgress::-webkit-progress-bar { background-color: var(--bg-input); border-radius: 4px;}
        #searchProgress::-webkit-progress-value { background-color: var(--accent-green); border-radius: 4px;}

        #searchResults {
            margin: 0 auto 50px;
            max-width: 850px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .vm-info {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .vm-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 16px;
        }

        h2 { margin: 0; font-size: 20px; font-weight: 600; }

        .vm-action-button {
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 6px;
            transition: all 0.2s ease;
        }

        .vm-action-button.power-on { background: rgba(76,175,80,0.12); color: var(--btn-power); }
        .vm-action-button.power-on:hover { background: var(--btn-power); color: #fff; }
        .vm-action-button.reboot { background: rgba(255,179,0,0.12); color: var(--btn-reboot); }
        .vm-action-button.reboot:hover { background: var(--btn-reboot); color: #121212; }
        .vm-action-button.shutdown { background: rgba(244,67,54,0.12); color: var(--btn-shutdown); }
        .vm-action-button.shutdown:hover { background: var(--btn-shutdown); color: #fff; }

        .meta-data-line { font-size: 14px; margin: 8px 0; color: var(--text-muted); }
        .meta-data-line strong { color: var(--text-main); }

        .copy-btn {
            padding: 3px 8px;
            background: #202b36;
            color: #a0aec0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 6px;
        }
        .copy-btn.copied-success { background: var(--btn-copy-success)!important; color:#fff!important; }

        .primary-ip-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 14px 0;
            background: rgba(26,35,45,0.4);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .ip-val { font-family: monospace; font-weight: 700; background: #0b0f12; padding: 2px 6px; border-radius: 4px; }

        .toggle-ips-btn {
            background: #243140;
            color: var(--text-main);
            border: 1px solid #334457;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-left: auto;
        }

        .additional-ips-list {
            margin: -6px 0 16px 24px;
            padding: 4px 0 4px 16px;
            border-left: 2px dashed var(--accent-green);
            list-style: none;
        }

        .network-details-list {
            margin: 10px 0 0;
            padding: 0;
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }

        .network-adapter-card {
            background: #1a232d;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
        }

        .badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 50px; float: right; text-transform: uppercase;}
        .badge.connected { background: rgba(76,175,80,0.15); color: #81c784; }
        .badge.disconnected { background: rgba(244,67,54,0.15); color: #e57373; }

        .mac-row {
            font-size: 12px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #243140;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button.disconnect {
            background: rgba(229,57,53,0.12);
            color: #ef5350;
            border: 1px solid rgba(229,57,53,0.3);
            border-radius: 6px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 11px;
        }
        button.disconnect:hover { background: var(--btn-disconnect); color: #fff; }

        #passwordDialog {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(5,7,9,0.85);
            backdrop-filter: blur(4px);
            z-index: 1000;
        }

        .dialog-content {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 12px;
            width: 280px;
            margin: 15% auto;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .dialog-content input {
            background: var(--bg-main);
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            width: calc(100% - 18px);
            margin: 12px 0;
            text-align: center;
            outline: none;
        }

        .dialog-actions { display: flex; gap: 8px; }
        .dialog-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
        .dialog-btn.confirm { background: var(--accent-green); color: #fff; }
        .dialog-btn.cancel { background: #243140; color: #fff; }
    </style>
</head>
<body>

<div id="title-container">
    <h1 id="vmfinder-header"><i class="fas fa-layer-group"></i> VMFinder</h1>
</div>

<form id="searchForm">
    <div class="search-input-wrapper">
        <i class="fas fa-search" style="color: var(--text-muted)"></i>
        <input type="text" id="searchInput" placeholder="Search VM Name, IP or MAC..." required autocomplete="off">
        <button type="submit">Search</button>
    </div>
    <div id="progress-container">
        <div id="progress-text"><i class="fas fa-circle-notch fa-spin"></i> Querying Assets...</div>
        <progress id="searchProgress" value="10" max="100"></progress>
    </div>
</form>

<div id="searchResults"></div>

<div id="passwordDialog">
    <div class="dialog-content">
        <label style="font-weight:600;"><i class="fas fa-shield-halved"></i> Admin Access Required</label>
        <input type="password" id="passwordInput" placeholder="••••••••">
        <div class="dialog-actions">
            <button class="dialog-btn cancel" onclick="closePasswordDialog()">Cancel</button>
            <button class="dialog-btn confirm" onclick="submitPassword()">Confirm</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('vmfinder-header').addEventListener('click', () => location.reload());

    document.getElementById('searchForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const query = document.getElementById('searchInput').value;
        this.classList.add('searching');

        fetch(`/search?query=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                this.classList.remove('searching');
                displayResults(data);
            })
            .catch(() => this.classList.remove('searching'));
    });

    function displayResults(results) {
        const wrapper = document.getElementById('searchResults');
        wrapper.innerHTML = results.length === 0 ? '<div style="text-align:center; color:var(--text-muted);">No records found.</div>' : '';

        // Safe conversion of string formatting to prevent characters splitting inside attribute spaces
        for (const res of results) {
            const primaryIP = res.ip_addresses[0] || 'N/A';
            const extraIPs = res.ip_addresses.slice(1);
            const safeVmId = res.vm_name.replace(/[^a-zA-Z0-9-_]/g, '_');

            const card = document.createElement('div');
            card.className = 'vm-info';
            card.innerHTML = `
                <div class="vm-card-header">
                    <h2><i class="fas fa-server" style="color:var(--text-muted)"></i> ${res.vm_name}</h2>
                    <div>
                        <button class="vm-action-button power-on" onclick="openActionDialog('${res.vm_name}', 'power_on')"><i class="fas fa-play"></i></button>
                        <button class="vm-action-button reboot" onclick="openActionDialog('${res.vm_name}', 'reboot')"><i class="fas fa-redo"></i></button>
                        <button class="vm-action-button shutdown" onclick="openActionDialog('${res.vm_name}', 'shutdown')"><i class="fas fa-power-off"></i></button>
                    </div>
                </div>
                <div class="meta-data-line"><strong>vCenter:</strong> ${res.vcenter_name} <button onclick="copyText('${res.vcenter_name}', this)" class="copy-btn">Copy</button></div>
                <div class="primary-ip-row">
                    <span><strong>IP:</strong> <span class="ip-val">${primaryIP}</span></span>
                    ${primaryIP !== 'N/A' ? `<button onclick="copyText('${primaryIP}', this)" class="copy-btn">Copy</button>` : ''}
                    ${extraIPs.length ? `<button id="exp-${safeVmId}" class="toggle-ips-btn" onclick="toggleIPs('${safeVmId}', ${extraIPs.length})">Show More (${extraIPs.length})</button>` : ''}
                </div>
                <ul id="ips-${safeVmId}" class="additional-ips-list" style="display:none;">
                    ${extraIPs.map(ip => `<li style="margin:6px 0;"><span class="ip-val">${ip}</span> <button onclick="copyText('${ip}', this)" class="copy-btn">Copy</button></li>`).join('')}
                </ul>
                <div class="network-details-list">
                    ${res.network_details.map(net => `
                        <div class="network-adapter-card">
                            <span class="badge ${net.network_name ? 'connected' : 'disconnected'}">${net.network_name ? 'Connected' : 'Disconnected'}</span>
                            <div style="font-weight:600; font-size:14px;">${net.adapter_name}</div>
                            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${net.network_name || 'No Switch Bound'}</div>
                            <div class="mac-row">
                                <span style="font-family:monospace;">${net.mac_address || 'N/A'}</span>
                                ${net.network_name ? `<button onclick="openDisconnectDialog('${res.vm_name}', '${net.adapter_name}')" class="disconnect">Isolate</button>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>`;
            wrapper.appendChild(card);
        }
    }

    function toggleIPs(safeId, count) {
        const el = document.getElementById(`ips-${safeId}`);
        const btn = document.getElementById(`exp-${safeId}`);
        const active = el.style.display === 'none';
        el.style.display = active ? 'block' : 'none';
        btn.textContent = active ? 'Hide' : `Show More (${count})`;
    }

    function copyText(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            btn.classList.add('copied-success');
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.classList.remove('copied-success'); btn.textContent = 'Copy'; }, 1000);
        });
    }

    let currentActionContext = null;
    const dialog = document.getElementById('passwordDialog');
    const pin = document.getElementById('passwordInput');

    function openDisconnectDialog(vmName, adapterName) { currentActionContext = { type: 'disconnect', vmName, adapterName }; pin.value = ''; dialog.style.display = 'block'; pin.focus(); }
    function openActionDialog(vmName, action) { currentActionContext = { type: 'control', vmName, action }; pin.value = ''; dialog.style.display = 'block'; pin.focus(); }
    function closePasswordDialog() { dialog.style.display = 'none'; }

    function submitPassword() {
        if (!pin.value) return;
        const url = currentActionContext.type === 'disconnect' ? '/disconnect' : '/control_vm';
        const payload = currentActionContext.type === 'disconnect'
            ? { vm_name: currentActionContext.vmName, adapter_name: currentActionContext.adapterName, password: pin.value }
            : { vm_name: currentActionContext.vmName, action: currentActionContext.action, password: pin.value };

        fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(res => { if(res.status === 401) throw new Error("Unauthorized Access Key."); return res.json(); })
            .then(data => { alert(data.message); dialog.style.display = 'none'; })
            .catch(err => alert(err.message));
    }
</script>
</body>
</html>
